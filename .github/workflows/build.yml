name: RG353PS Slot bundle

on:
  push:
    branches: [main]
    paths:
      - "platforms/rg353ps/**"
      - "tools/common.sh"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "platforms/rg353ps/**"
      - "tools/common.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slot-rg353ps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Slot bundle for RG353PS
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          sh -n tools/common.sh
          sh -n platforms/rg353ps/build-slot.sh
          sh -n platforms/rg353ps/frontends/slot/launch.sh
      - name: Build Slot
        run: sh platforms/rg353ps/build-slot.sh
      - name: Publish bundle
        uses: actions/upload-artifact@v4
        with:
          name: baseos-rg353ps-slot
          if-no-files-found: error
          path: |
            work/rg353ps/frontends/baseos-rg353ps-slot.zip
            work/rg353ps/frontends/baseos-rg353ps-slot.zip.sha256
